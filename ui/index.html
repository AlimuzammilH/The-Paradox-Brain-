<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#03050a" />
  <title>Paradox</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="labels"></div>

  <div id="hud">
    <header class="top">
      <div class="brand"><span class="mark">PARADOX</span><span class="sub">a quiet engine for hard thoughts</span></div>
      <div class="status"><span id="mode" class="mode"></span><span id="phase" class="phase">BOOT</span></div>
    </header>

    <aside id="trace" class="trace"></aside>
    <aside id="cands" class="cands"></aside>

    <div id="title" class="title"></div>

    <section id="answer" class="answer hidden">
      <div class="answer-meta"><span id="answer-move"></span><span id="answer-cost"></span></div>
      <div id="answer-text" class="answer-text"></div>
      <div id="objection" class="objection hidden"></div>
      <div class="rate" id="rate">
        <span class="rate-label">RATE</span>
        <button data-r="1">✦</button><button data-r="2">✦</button><button data-r="3">✦</button><button data-r="4">✦</button><button data-r="5">✦</button>
        <button id="why" class="why">WHY</button>
      </div>
    </section>

    <form id="ask" class="ask" autocomplete="off">
      <span class="caret">›</span>
      <input id="input" type="text" spellcheck="false" placeholder="State a contradiction." />
      <button type="submit" class="go">ENTER</button>
    </form>

    <div class="sound">
      <button id="mute" class="mute" aria-label="Sound">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path id="waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/><path id="cross" d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.6" aria-label="Volume" />
    </div>
  </div>
  <div id="flash"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
